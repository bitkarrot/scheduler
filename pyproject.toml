[project]
name = "lnbits-scheduler"
version = "0.0.0"
description = "LNbits, free and open-source Lightning wallet and accounts system."
requires-python = ">=3.10,<3.13"
authors = [{name = "Alan Bits", email = "alan@lnbits.com"}]
dependencies = [
    "lnbits",
    "apscheduler>=3.10.0,<4.0",
    "httpx>=0.27.0",
    # Security-pinned transitive dependencies (resolved via Dependabot alerts)
    "Pillow>=12.3.0",
    "cryptography>=50.0.0",
    "urllib3>=2.7.0",
    "aiohttp>=3.14.3",
    "h11>=0.16.0",
    "ecdsa>=0.19.2",
    "filelock>=3.20.3",
    "idna>=3.15",
    "marshmallow>=3.26.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "virtualenv>=20.36.1",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "pytest-asyncio>=0.21.0",
    "pytest>=9.0.3",
    "mypy>=1.5.1",
    "pre-commit>=3.2.2",
    "ruff>=0.3.2",
]

[tool.poetry]
name = "lnbits-scheduler"
version = "0.0.0"
description = "LNbits, free and open-source Lightning wallet and accounts system."
authors = ["Alan Bits <alan@lnbits.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
lnbits = {version = "*",  allow-prereleases = true}
apscheduler = "^3.10.0"
httpx = "^0.27.0"
# Security-pinned transitive dependencies (resolved via Dependabot alerts)
Pillow = ">=12.3.0"
cryptography = ">=50.0.0"
urllib3 = ">=2.7.0"
aiohttp = ">=3.14.3"
h11 = ">=0.16.0"
ecdsa = ">=0.19.2"
filelock = ">=3.20.3"
idna = ">=3.15"
marshmallow = ">=3.26.2"
python-dotenv = ">=1.2.2"
requests = ">=2.33.0"
virtualenv = ">=20.36.1"

[tool.poetry.group.dev.dependencies]
black = ">=26.3.1"
pytest-asyncio = "^0.21.0"
pytest = ">=9.0.3"
mypy = "^1.5.1"
pre-commit = "^3.2.2"
ruff = "^0.3.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
follow_imports = "skip"
ignore_errors = true
exclude = "(nostr/*)"
[[tool.mypy.overrides]]
module = [
  "lnbits.*",
  "lnurl.*",
  "loguru.*",
  "fastapi.*",
  "pydantic.*",
  "pyqrcode.*",
  "shortuuid.*",
  "httpx.*",
  "apscheduler.*",
]
ignore_missing_imports = "True"

[tool.pytest.ini_options]
log_cli = false
testpaths = [
  "tests"
]

[tool.black]
line-length = 88

[tool.ruff]
# Same as Black. + 10% rule of black
line-length = 88
exclude = [
    "nostr",
]

[tool.ruff.lint]
# Enable:
# F - pyflakes
# E - pycodestyle errors
# W - pycodestyle warnings
# I - isort
# A - flake8-builtins
# C - mccabe
# N - naming
# UP - pyupgrade
# RUF - ruff
# B - bugbear
select = ["F", "E", "W", "I", "A", "C", "N", "UP", "RUF", "B"]
ignore = ["C901"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# needed for pydantic
[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "validator",
    "root_validator",
]

# Ignore unused imports in __init__.py files.
# [tool.ruff.lint.extend-per-file-ignores]
# "__init__.py" = ["F401", "F403"]

# [tool.ruff.lint.mccabe]
# max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "lnbits.decorators.parse_filters"
]

[tool.uv]
package = false
prerelease = "allow"
